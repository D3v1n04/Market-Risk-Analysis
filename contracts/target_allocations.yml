contract_version: 1.0.0
dataset: target_allocations
dataset_class: git_managed_configuration
description: Signed instrument weights used to initialize each MVP portfolio.
grain: One row represents one instrument allocation for one portfolio effective on one date.

primary_key:
  - portfolio_id
  - instrument_id
  - effective_from

foreign_keys:
  - fields: [portfolio_id]
    references: portfolios.portfolio_id
  - fields: [instrument_id]
    references: instruments.instrument_id

fixture:
  path: data/fixtures/target_allocations.csv
  format: csv

fields:
  - name: portfolio_id
    type: STRING
    nullable: false
  - name: instrument_id
    type: STRING
    nullable: false
  - name: effective_from
    type: DATE
    nullable: false
  - name: effective_to
    type: DATE
    nullable: true
  - name: target_weight
    type: DECIMAL(12,10)
    nullable: false
    description: Signed ratio of initial NAV; a negative value represents a short allocation.
  - name: allocation_version
    type: STRING
    nullable: false
  - name: record_hash
    type: STRING
    nullable: false
    format: '^[0-9a-f]{64}$'

record_hash:
  algorithm: SHA-256
  encoding: UTF-8
  delimiter: '|'
  null_token: <NULL>
  fields:
    - portfolio_id
    - instrument_id
    - effective_from
    - effective_to
    - target_weight
    - allocation_version

quality_rules:
  - rule_id: ALLOCATION_ACTIVE_COVERAGE
    severity: ERROR
    assertion: Each active portfolio has exactly 15 unique active instrument allocations.
  - rule_id: ALLOCATION_BUSINESS_KEY_UNIQUE
    severity: ERROR
    assertion: portfolio_id, instrument_id, and effective_from are unique together.
  - rule_id: ALLOCATION_FOREIGN_KEYS_VALID
    severity: ERROR
    assertion: Every portfolio_id and instrument_id resolves to an active fixture record.
  - rule_id: ALLOCATION_WEIGHT_NONZERO
    severity: ERROR
    assertion: target_weight is not zero.
  - rule_id: ALLOCATION_LONG_ONLY_TOTALS
    severity: ERROR
    tolerance: '0.000001'
    assertion: CORE_15_LONG has no negative weights and signed and gross totals equal 1.0.
  - rule_id: ALLOCATION_LONG_SHORT_TOTALS
    severity: ERROR
    tolerance: '0.000001'
    assertion: LONG_SHORT_130_30 positive, negative, gross, and net totals equal 1.3, -0.3, 1.6, and 1.0.
  - rule_id: ALLOCATION_EFFECTIVE_DATE_RANGE
    severity: ERROR
    assertion: effective_to is null or on or after effective_from, with no overlapping ranges.
  - rule_id: ALLOCATION_RECORD_HASH_VALID
    severity: ERROR
    assertion: record_hash matches the canonical SHA-256 calculation.

