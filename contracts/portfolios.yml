contract_version: 1.0.0
dataset: portfolios
dataset_class: git_managed_configuration
description: Identity, strategy, capital, and exposure targets for the two MVP portfolios.
grain: One row represents one project portfolio.

primary_key:
  - portfolio_id

fixture:
  path: data/fixtures/portfolios.csv
  format: csv

fields:
  - name: portfolio_id
    type: STRING
    nullable: false
    description: Stable project portfolio identifier in uppercase snake case.
  - name: portfolio_name
    type: STRING
    nullable: false
    description: Human-readable portfolio name.
  - name: strategy_code
    type: STRING
    nullable: false
    allowed_values: [LONG_ONLY, LONG_SHORT_130_30]
  - name: base_currency
    type: STRING
    nullable: false
    allowed_values: [USD]
  - name: target_inception_date
    type: DATE
    nullable: false
    description: Requested first portfolio date.
  - name: actual_inception_date
    type: DATE
    nullable: true
    description: Earliest verified common session; null until initialization succeeds.
  - name: initial_nav
    type: DECIMAL(18,2)
    nullable: false
    unit: USD
    minimum_exclusive: 0
  - name: target_long_ratio
    type: DECIMAL(12,10)
    nullable: false
    minimum_inclusive: 0
  - name: target_short_ratio
    type: DECIMAL(12,10)
    nullable: false
    minimum_inclusive: 0
    description: Absolute short exposure divided by initial NAV.
  - name: target_gross_ratio
    type: DECIMAL(12,10)
    nullable: false
    minimum_inclusive: 0
  - name: target_net_ratio
    type: DECIMAL(12,10)
    nullable: false
    minimum_inclusive: 0
  - name: rebalance_policy
    type: STRING
    nullable: false
    allowed_values: [BUY_AND_HOLD]
  - name: cash_policy
    type: STRING
    nullable: false
    allowed_values: [RETAIN_DIVIDENDS_NO_INTEREST]
  - name: is_active
    type: BOOLEAN
    nullable: false
  - name: config_version
    type: STRING
    nullable: false
  - name: record_hash
    type: STRING
    nullable: false
    format: '^[0-9a-f]{64}$'

record_hash:
  algorithm: SHA-256
  encoding: UTF-8
  delimiter: '|'
  null_token: <NULL>
  boolean_format: lowercase
  fields:
    - portfolio_id
    - portfolio_name
    - strategy_code
    - base_currency
    - target_inception_date
    - actual_inception_date
    - initial_nav
    - target_long_ratio
    - target_short_ratio
    - target_gross_ratio
    - target_net_ratio
    - rebalance_policy
    - cash_policy
    - is_active
    - config_version

quality_rules:
  - rule_id: PORTFOLIO_ACTIVE_COUNT
    severity: ERROR
    assertion: Contract version 1.0.0 contains exactly two active portfolios.
  - rule_id: PORTFOLIO_ID_UNIQUE
    severity: ERROR
    assertion: portfolio_id is non-null and unique.
  - rule_id: PORTFOLIO_INITIAL_NAV_POSITIVE
    severity: ERROR
    assertion: initial_nav is greater than zero.
  - rule_id: PORTFOLIO_RATIO_RECONCILIATION
    severity: ERROR
    tolerance: '0.000001'
    assertion: Gross equals long plus short, and net equals long minus short.
  - rule_id: PORTFOLIO_STRATEGY_TARGETS
    severity: ERROR
    assertion: LONG_ONLY uses 1.0/0.0/1.0/1.0 and LONG_SHORT_130_30 uses 1.3/0.3/1.6/1.0.
  - rule_id: PORTFOLIO_INCEPTION_ORDER
    severity: ERROR
    assertion: actual_inception_date is null or on or after target_inception_date.
  - rule_id: PORTFOLIO_RECORD_HASH_VALID
    severity: ERROR
    assertion: record_hash matches the canonical SHA-256 calculation.

