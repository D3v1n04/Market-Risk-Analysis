[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "market-risk-analysis"
version = "0.1.0"
description = "A learning-first market risk analysis lakehouse."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "exchange-calendars==4.13.2",
    "yfinance==1.7.0",
]

[project.scripts]
market-risk-check = "market_risk_analysis.environment:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pyyaml>=6.0.3",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.hatch.build]
exclude = [
    "/.cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.venv",
    "/dist",
]

[tool.hatch.build.targets.wheel]
packages = ["src/market_risk_analysis"]
